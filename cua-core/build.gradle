plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.interfaceai'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	implementation 'com.microsoft.playwright:playwright:1.47.0'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('discover', JavaExec) {
	group = 'application'
	mainClass = 'com.interfaceai.cuacore.cli.DiscoverCommand'
	classpath = sourceSets.main.runtimeClasspath
}

tasks.register('replay', JavaExec) {
	group = 'application'
	mainClass = 'com.interfaceai.cuacore.cli.ReplayCommand'
	classpath = sourceSets.main.runtimeClasspath
}

tasks.register('operatorConsole', JavaExec) {
	group = 'application'
	mainClass = 'com.interfaceai.cuacore.console.OperatorConsole'
	classpath = sourceSets.main.runtimeClasspath
	standardInput = System.in
}